apiVersion: dekopon.dev/brokerd/v1alpha1
socketPath: /run/dekopon/broker.sock
policiesPath: policies.cedar
secretMapPath: /etc/dekopon/secret-map.yaml
providers: [/opt/dekopon/providers/vm-provider.wasm]
principals:
  example-caller:
    subjects: [slack.example.user]
providerSettings:
  vm:
    baseUrl: https://vm-runner.vm-runner.svc.cluster.local:8443
http:
  extraCABundles: [/var/run/dekopon-trust/roots.pem]
  nonPublicHttps: [vm-runner.vm-runner.svc.cluster.local:8443]
capabilities:
  vm:
    constraints:
      timeoutMs: 30000
      maxOutputBytes: 1048576
      http:
        # Requires broker >= 0.23; remove this field on 0.22.
        propagateTrace: true
        allowedHosts: [vm-runner.vm-runner.svc.cluster.local:8443]
        allowedMethods: [GET, POST]
        maxRequests: 2
        maxRequestBytes: 200000
        maxResponseBytes: 1048576
        allowPlaintextLoopback: false
    capabilities:
      vm.exec: {}
      vm.job.get:
        constraints:
          http:
            allowedMethods: [GET]
            maxRequests: 1
      vm.artifact.read: {}

# Owner-only secret-map fragment; never put token bytes in providerSettings.
