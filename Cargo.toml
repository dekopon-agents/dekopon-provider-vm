[workspace]

[package]
name = "dekopon-vm-provider"
version = "0.6.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
description = "Broker-authorized vm-runner jail commands for Dekopon"
repository = "https://github.com/dekopon-agents/dekopon-provider-vm"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dekopon-provider-sdk = "=0.75.0"
clap = { version = "=4.6.6", features = ["derive"] }
schemars = "=1.2.2"
percent-encoding = "=2.3.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
hex = "=0.4.3"

[dev-dependencies]
async-trait = "=0.1.92"
dekopon-provider-sdk-testkit = "=0.75.0"
dekopon-broker-host = "=0.75.0"
dekopon-broker = "=0.75.0"
dekopon-broker-protocol = "=0.75.0"
dekopon-capability = "=0.75.0"
dekopon-core = "=0.75.0"
dekopon-http-host = "=0.75.0"
tempfile = "=3.27.0"
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "time"] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"

[lints.rust]
missing_docs = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
