[workspace]

[package]
name = "dekopon-vm-provider"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
description = "Broker-authorized vm-runner jail commands for Dekopon"
repository = "https://github.com/dekopon-agents/dekopon-provider-vm"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dekopon-provider-sdk = { git = "https://github.com/dekopon-agents/dekopon", rev = "16c17e8554d7142ba3ebb944930bbfae64bc2db6" }
clap = { version = "=4.6.6", features = ["derive"] }
schemars = "=1.2.2"
percent-encoding = "=2.3.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[dev-dependencies]
async-trait = "=0.1.92"
dekopon-provider-sdk-testkit = { git = "https://github.com/dekopon-agents/dekopon", rev = "16c17e8554d7142ba3ebb944930bbfae64bc2db6" }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "time"] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"

[lints.rust]
missing_docs = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
